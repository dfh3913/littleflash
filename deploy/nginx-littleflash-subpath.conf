# LittleFlash · 子路径反代片段（6090723.xyz）
#
# 已合并进 /www/server/panel/vhost/nginx/html_6090723.xyz.conf 的 server {} 内。
# 要点：
#   1. 用 ^~ 前缀匹配，优先于该站点里按扩展名缓存图片/JS/CSS 的正则 location，
#      否则 /littleflash/static/*.js 会被当作本地静态文件返回 404。
#   2. proxy_pass 末尾带 /，即剥掉 /littleflash 前缀再交给应用。
#   3. X-Forwarded-Prefix 让 Flask 生成 /littleflash 开头的静态资源、接口与跳转地址。
#   4. 只匹配 /littleflash/ 与 /littleflash，不影响同一 server 下的其它路径。

location = /littleflash {
    return 301 /littleflash/;
}

location ^~ /littleflash/ {
    proxy_pass http://127.0.0.1:4570/;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /littleflash;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # 设置页只提交小型 JSON
    client_max_body_size 64k;
}
