# LittleFlash · nginx reverse-proxy example
# Serve the app at the domain root; gunicorn listens on 127.0.0.1:8000.
# For HTTPS, add a 443 server block (or use certbot) and set
# security.cookie_secure (SQLite site_settings) to true.

upstream littleflash_backend {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name flash.example.com;

    # Settings only submit small JSON documents.
    client_max_body_size 64k;
    server_tokens off;

    location / {
        proxy_pass http://littleflash_backend;
        proxy_http_version 1.1;

        # $http_host preserves a non-standard port, keeping Origin checks exact.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # HTTPS example:
    #
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
