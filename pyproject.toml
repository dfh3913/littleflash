[project]
name = "littleflash"
version = "0.2.0"
description = "闪词 LittleFlash：漂亮的本地单词闪卡网页，带 Python 后端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
]

[project.scripts]
littleflash = "littleflash:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
