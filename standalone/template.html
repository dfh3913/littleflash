<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2eee4">
  <meta name="description" content="闪词 LittleFlash 单文件版：无需后端，打开即用。">
  <title>闪词 · LittleFlash 单文件版</title>
  <link rel="icon" type="image/png" href="{{FAVICON}}">
  <style>{{CSS}}</style>
</head>
<body class="page page-home">
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-bolt" viewBox="0 0 24 24"><path d="M13.8 2 4.7 13.4h6.1L9.9 22l9.4-11.8h-6.1L13.8 2Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.2l4.3 3.5V6L7.2 9.5H4Z"/><path d="M15.3 9.1a4.2 4.2 0 0 1 0 5.8M18 6.6a8 8 0 0 1 0 10.8"/></symbol>
    <symbol id="icon-volume-off" viewBox="0 0 24 24"><path d="M4 9.5v5h3.2l4.3 3.5V6L7.2 9.5H4Z"/><path d="m16 10 4 4m0-4-4 4"/></symbol>
    <symbol id="icon-gear" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-2.87 2.87-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.55v-.1A1.7 1.7 0 0 0 8.4 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06-2.87-2.87.06-.06A1.7 1.7 0 0 0 4 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2.2V9.55h.1A1.7 1.7 0 0 0 3.9 8.4a1.7 1.7 0 0 0-.34-1.87l-.06-.06L6.37 3.6l.06.06A1.7 1.7 0 0 0 8.3 4a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2.2h4.05v.1A1.7 1.7 0 0 0 14.9 3.9a1.7 1.7 0 0 0 1.87-.34l.06-.06 2.87 2.87-.06.06A1.7 1.7 0 0 0 19.3 8.3a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.1v4.05h-.1A1.7 1.7 0 0 0 19.4 15Z"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8.2 5.4v13.2L19 12 8.2 5.4Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5.5v13M16 5.5v13"/></symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M4.5 5.5A2.5 2.5 0 0 1 7 3h12.5v15H7a2.5 2.5 0 0 0-2.5 2.5v-15Z"/><path d="M4.5 20.5V5.5M19.5 18v3H7"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 9.3A7.5 7.5 0 0 1 19.4 12M4.6 12a7.5 7.5 0 0 0 13.3 2.7"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-loader" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></symbol>
  </svg>

  <div class="ambient" aria-hidden="true">
    <span class="ambient__wash ambient__wash--lime"></span>
    <span class="ambient__wash ambient__wash--peach"></span>
    <span class="ambient__grid"></span>
    <span class="ambient__ring"></span>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#" aria-label="闪词 LittleFlash">
        <span class="brand__mark" aria-hidden="true"><svg class="icon icon--bolt"><use href="#icon-bolt"></use></svg></span>
        <span class="brand__name">闪词</span>
        <span class="brand__latin">LittleFlash</span>
      </a>
      <div class="header-actions">
        <button class="icon-button icon-button--sound" id="soundToggle" type="button" aria-label="关闭发音" aria-pressed="true" title="关闭发音">
          <svg class="icon sound-on" aria-hidden="true"><use href="#icon-volume"></use></svg>
          <svg class="icon sound-off" aria-hidden="true" hidden><use href="#icon-volume-off"></use></svg>
        </button>
        <button class="header-link" id="settingsBtn" type="button" title="打开设置">
          <svg class="icon" aria-hidden="true"><use href="#icon-gear"></use></svg>
          <span>设置</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container study-main">
    <section class="study-panel" aria-label="闪词学习区">
      <header class="study-topbar">
        <div class="study-book">
          <span class="study-book__mark" aria-hidden="true"><svg class="icon"><use href="#icon-book"></use></svg></span>
          <div class="study-book__copy">
            <span class="study-book__kicker">正在学习</span>
            <h1 class="study-book__title" id="bookTitle">正在读取词书</h1>
            <p class="study-book__meta"><span id="bookStage">—</span><span class="meta-dot" aria-hidden="true"></span><span id="bookCount">— 个单词</span></p>
          </div>
        </div>
        <div class="study-progress">
          <div class="study-progress__head"><span>本轮进度</span><strong id="bookProgressText">— / —</strong></div>
          <div class="progress-track" aria-hidden="true"><span id="bookProgress"></span></div>
        </div>
      </header>

      <div class="study-context">
        <div class="context-chip"><svg class="icon" aria-hidden="true"><use href="#icon-book"></use></svg><span id="unitLabel">正在加载学习范围</span></div>
        <div class="study-context__right">
          <form class="jump-form" id="jumpForm" autocomplete="off" novalidate>
            <label class="sr-only" for="jumpInput">跳到第几个单词</label>
            <input class="jump-input" id="jumpInput" type="number" min="1" step="1" inputmode="numeric" placeholder="第N词">
            <button class="jump-button" id="jumpBtn" type="submit" title="跳转到指定位置（G）">跳转</button>
          </form>
          <span class="round-badge" id="roundBadge">第 1 轮</span>
          <span class="pace-chip" id="paceChip"><span class="pace-chip__dot" aria-hidden="true"></span><span id="paceText">自动 · 4 秒</span></span>
        </div>
      </div>

      <div class="card-stack">
        <span class="card-sheet" aria-hidden="true"></span>
        <article class="flashcard" id="flashcard" tabindex="0">
          <span class="card-grain" aria-hidden="true"></span>
          <span class="card-watermark" id="cardWatermark" aria-hidden="true">Aa</span>

          <div class="card-state" id="cardState" hidden>
            <div class="card-state__inner">
              <span class="state-loader" aria-hidden="true"><svg class="icon"><use href="#icon-loader"></use></svg></span>
              <p class="card-state__eyebrow">WORDS ON THE WAY</p>
              <h2 class="card-state__title" id="cardStateTitle">正在展开词书</h2>
              <p class="card-state__message" id="cardStateMessage">为你整理今天的单词与节奏…</p>
            </div>
          </div>

          <div class="card-main" id="cardMain">
            <header class="card-head">
              <span class="face-label" id="faceLabel"><span class="face-label__dot" aria-hidden="true"></span><span id="faceLabelText">ENGLISH</span></span>
              <button class="card-replay" id="replayBtn" type="button" aria-label="重播单词发音" title="重播发音（R）"><svg class="icon" aria-hidden="true"><use href="#icon-volume"></use></svg></button>
            </header>
            <div class="card-content" id="cardContent">
              <div class="word-block" id="wordBlock"><h2 class="word" id="wordText"></h2><p class="phonetic" id="phoneticText"></p></div>
              <div class="meaning-block" id="meaningBlock" hidden><span class="meaning-quote" aria-hidden="true">“</span><p class="meaning" id="meaningText"></p></div>
              <div class="card-lines" id="cardLines" hidden>
                <p class="card-lines__head"><span class="card-lines__word" id="cardLinesWord"></span><span class="card-lines__pos" id="cardLinesPos"></span></p>
                <p class="card-lines__extra" id="cardLinesExtra"></p>
                <p class="card-lines__note" id="cardLinesNote" hidden></p>
              </div>
            </div>
            <footer class="card-foot"><span class="card-tip" id="cardTip"><svg class="icon" aria-hidden="true"><use href="#icon-refresh"></use></svg><span id="cardTipText">点击翻面</span></span></footer>
          </div>
          <div class="card-word-progress" aria-hidden="true"><span id="cardWordProgress"></span></div>
        </article>
      </div>

      <div class="player">
        <div class="player__controls">
          <button class="round-control" id="prevBtn" type="button" aria-label="上一个单词" title="上一个单词（←）"><svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"></use></svg></button>
          <button class="primary-action" id="playBtn" type="button" aria-keyshortcuts="Space">
            <svg class="icon primary-action__icon" id="iconPause" aria-hidden="true"><use href="#icon-pause"></use></svg>
            <svg class="icon primary-action__icon" id="iconPlay" aria-hidden="true" hidden><use href="#icon-play"></use></svg>
            <span class="primary-action__label" id="playLabel">暂停</span>
          </button>
          <button class="round-control" id="nextBtn" type="button" aria-label="下一个单词" title="下一个单词（→）"><svg class="icon" aria-hidden="true"><use href="#icon-arrow-right"></use></svg></button>
        </div>
        <div class="player__meta">
          <span class="player__hint"><span class="live-dot" id="liveDot" aria-hidden="true"></span><span id="playerHint">正在准备学习节奏…</span></span>
          <span class="player__shortcut"><kbd>Space</kbd><span>翻面/暂停</span><span class="shortcut-sep">·</span><kbd>←</kbd><kbd>→</kbd><span>切换</span></span>
        </div>
      </div>
    </section>
  </main>

  <button class="standalone-trigger" id="settingsBtnFixed" type="button" hidden aria-hidden="true">设置</button>

  <aside class="standalone-panel" id="settingsPanel" hidden>
    <div class="standalone-panel__sheet" role="dialog" aria-modal="true" aria-labelledby="settingsPanelTitle">
      <header class="standalone-panel__head">
        <strong id="settingsPanelTitle">学习设置</strong>
        <button class="standalone-panel__close" id="closeSettings" type="button" aria-label="关闭设置">×</button>
      </header>
      <div class="standalone-panel__body">
        <div class="standalone-intro" id="standaloneIntro" hidden>
          <strong>三步开始闪词</strong>
          <ol>
            <li>勾选词书，再点选单元</li>
            <li>选好方向、顺序和节奏</li>
            <li>打开声音，点「开始学习」</li>
          </ol>
          <button class="standalone-small-button" id="stIntroDone" type="button">开始学习</button>
        </div>
        <div class="standalone-summary" id="settingsSummary"></div>
        <div class="standalone-field">
          <span class="standalone-field__label">词书与单元</span>
          <div class="standalone-books" id="standaloneBooks"></div>
        </div>
        <div class="standalone-field">
          <label for="stFront">显示方向</label>
          <select id="stFront"><option value="en">先英后中</option><option value="zh">先中后英</option></select>
        </div>
        <div class="standalone-field">
          <label for="stOrder">显示顺序</label>
          <select id="stOrder"><option value="sequence">按词书顺序</option><option value="random">随机（种子）</option></select>
        </div>
        <div class="standalone-field" id="stSeedField" hidden>
          <label for="stSeed">随机种子</label>
          <div class="standalone-seed-row"><input id="stSeed" type="text" maxlength="64" autocomplete="off" spellcheck="false"><button class="standalone-small-button" id="stSeedRefresh" type="button">换一个</button></div>
        </div>
        <div class="standalone-field">
          <label for="stMode">切换方式</label>
          <select id="stMode"><option value="auto">自动切换</option><option value="manual">手动切换</option></select>
        </div>
        <div class="standalone-field">
          <label for="stInterval">切换间隔：<span id="stIntervalValue">4</span> 秒</label>
          <input id="stInterval" type="range" min="1" max="30" step="0.5">
        </div>
        <div class="standalone-field">
          <label><input id="stAudio" type="checkbox"> 单词发音</label>
        </div>
        <div class="standalone-field">
          <label for="stVolume">音量</label>
          <input id="stVolume" type="range" min="0" max="100" step="5">
        </div>
        <div class="standalone-field">
          <label for="stFont">卡片字号：<span id="stFontValue">100</span>%</label>
          <input id="stFont" type="range" min="80" max="180" step="5">
        </div>
        <button class="standalone-small-button" id="stReset" type="button">恢复默认设置</button>
      </div>
    </div>
  </aside>

  <script id="lf-data" type="application/json">{{DATA}}</script>
  <script>{{JS}}</script>
</body>
</html>
